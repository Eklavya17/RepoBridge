[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repobridge"
version = "0.0.1"
description = "Multi-agent reasoning and context management for large-scale repositories"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Eklavya Tyagi" },
  { name = "Sunwoo Baek" },
  { name = "Vishal Kaushik" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
repobridge = "repobridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repobridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["testing/prior_work/_upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long docstrings in stubs; ruff format handles code
